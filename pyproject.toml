[project]
name = "zdiscli"
version = "0.1.0"
description = "Terminal REPL for Discord"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "zerith", email = "me.secur1ty.dev@gmail.com" },
]
keywords = ["discord", "cli", "terminal", "repl", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Terminals",
]
dependencies = [
    "aiohttp>=3.9",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/Ze-rith/discli"
Repository = "https://github.com/Ze-rith/discli"
Issues = "https://github.com/Ze-rith/discli/issues"

[project.scripts]
discli = "discli.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["discli*"]
