[project]
name = "discli"
version = "0.1.0"
description = "Terminal REPL for Discord"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "prompt_toolkit>=3.0",
]

[project.scripts]
discli = "discli.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["discli*"]
